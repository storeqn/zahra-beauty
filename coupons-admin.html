<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed">
<title>إدارة الكوبونات | زهرة بيوتي</title>
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.container{width:min(900px,calc(100% - 24px));max-width:100%;margin:18px auto 50px;overflow:hidden}.head{text-align:center;margin-bottom:16px}.head h1{margin:0 0 6px}.head p{margin:0;color:#777}.nav{display:flex;gap:8px;margin-bottom:14px}.nav a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:14px;background:#fff;color:#171512;border:1px solid #e8e1d5;font-weight:800}.nav a.active{background:#11100e;color:#fff}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.06);margin-bottom:14px;min-width:0;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;min-width:0}.field{margin-bottom:13px;min-width:0}label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}input,select{width:100%;max-width:100%;min-width:0;padding:13px;border:1px solid #ddd7cc;border-radius:12px;font:inherit;background:#fff}input[type="datetime-local"]{display:block;width:100%;max-width:100%;min-width:0;font-size:14px;padding:11px 10px;direction:ltr;text-align:left;-webkit-appearance:none;appearance:none}.check{display:flex;align-items:center;gap:8px;margin:6px 0 14px}.check input{width:20px;height:20px}.primary,.secondary,.danger{border:0;border-radius:13px;padding:13px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{width:100%;background:#11100e;color:#fff}.secondary{background:#eee9df;color:#171512}.danger{background:#fff0f0;color:#a52828}.status{display:none;margin-top:12px;padding:11px;border-radius:12px;text-align:center;font-weight:700}.status.ok{display:block;background:#e7f8ed;color:#176b38}.status.err{display:block;background:#ffebeb;color:#a52828}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar button{min-width:48px}.list{display:grid;gap:9px}.coupon{border:1px solid #ece5d9;border-radius:15px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-width:0}.coupon h3{margin:0 0 5px;font-size:16px}.meta{font-size:12px;color:#777;line-height:1.7;overflow-wrap:anywhere}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.active{background:#e7f8ed;color:#176b38}.expired{background:#fff0f0;color:#a52828}.scheduled{background:#fff4d8;color:#765500}.disabled{background:#eee;color:#666}.actions{display:flex;gap:6px}.empty{text-align:center;color:#777;padding:24px}.note{background:#fff4d8;color:#765500;padding:11px 13px;border-radius:13px;font-size:13px;line-height:1.7;margin-bottom:12px}@media(max-width:600px){.container{width:calc(100% - 16px);margin-top:8px}.card{padding:14px}.row{grid-template-columns:1fr;gap:0}.coupon{grid-template-columns:1fr}.actions button{flex:1}.head h1{font-size:23px}input[type="datetime-local"]{font-size:13px;padding:10px 8px}}
body.embedded .head,body.embedded .nav{display:none}body.embedded .container{margin-top:0;width:100%}
</style>
</head>
<body>
<div class="container">
  <div class="head"><h1>إدارة كوبونات زهرة بيوتي</h1><p>إنشاء كوبونات بمدة محددة وإيقافها أو حذفها</p></div>
  <div class="nav"><a href="admin.html">إدارة المنتجات</a><a href="coupons-admin.html" class="active">إدارة الكوبونات</a></div>

  <section class="card">
    <div class="note">إذا تركت البداية فارغة فالكوبون يبدأ فوراً. وإذا تركت النهاية فارغة فيبقى فعالاً بدون تاريخ انتهاء حتى توقفه يدوياً.</div>
    <form id="couponForm">
      <div class="field"><label>كود الكوبون *</label><input id="code" required placeholder="مثال: AMEER10" autocapitalize="characters"></div>
      <div class="row">
        <div class="field"><label>نوع الخصم</label><select id="type"><option value="percent">نسبة مئوية %</option><option value="fixed">مبلغ ثابت د.ع</option></select></div>
        <div class="field"><label>قيمة الخصم *</label><input id="value" type="number" min="1" required placeholder="10"></div>
      </div>
      <div class="field"><label>الحد الأدنى للطلب</label><input id="min" type="number" min="0" value="0" placeholder="0"></div>
      <div class="row">
        <div class="field"><label>يبدأ في</label><input id="start" type="datetime-local"></div>
        <div class="field"><label>ينتهي في</label><input id="end" type="datetime-local"></div>
      </div>
      <label class="check"><input id="active" type="checkbox" checked><span>الكوبون مفعل</span></label>
      <button id="saveBtn" class="primary" type="submit">+ إنشاء الكوبون</button>
      <button id="cancelBtn" class="secondary" type="button" style="width:100%;margin-top:8px;display:none">إلغاء التعديل</button>
      <div id="status" class="status"></div>
    </form>
  </section>

  <section class="card">
    <div class="toolbar"><strong style="flex:1">الكوبونات الحالية</strong><button id="refresh" class="secondary" type="button">↻</button></div>
    <div id="list" class="list"><div class="empty">جاري التحميل...</div></div>
  </section>
</div>
<script>
if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzAnGmxXNDdEmh2OeYIF5qX73rRxXFNE3_75WG9IEYD8hlj4cWdbkVla-uTuIUqcYS1/exec';
const $=id=>document.getElementById(id);
let editing='';
let coupons=[];
function status(msg,ok=true){const b=$('status');b.textContent=msg;b.className='status '+(ok?'ok':'err')}
function fmt(v,emptyText='بدون تحديد'){if(!v)return emptyText;try{const d=new Date(v);if(isNaN(d.getTime()))return emptyText;return new Intl.DateTimeFormat('ar-IQ',{dateStyle:'short',timeStyle:'short'}).format(d)}catch(_){return v||emptyText}}
function localValue(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function isCouponActive(c){
  const v=c?.active;
  if(v===false||v===0)return false;
  const s=String(v??'').trim().toLowerCase();
  if(['0','false','no','off','disabled','لا','متوقف'].includes(s))return false;
  return true;
}
function couponStatus(c){
  if(!isCouponActive(c))return 'disabled';
  const now=Date.now();
  const startRaw=c.start_at||c.start||'';
  const endRaw=c.end_at||c.end||'';
  const start=startRaw?new Date(startRaw).getTime():0;
  const end=endRaw?new Date(endRaw).getTime():0;
  if(start&&!isNaN(start)&&now<start)return 'scheduled';
  if(end&&!isNaN(end)&&now>end)return 'expired';
  return 'active';
}
async function load(){
  $('list').innerHTML='<div class="empty">جاري التحميل...</div>';
  try{const r=await fetch(`${SCRIPT_URL}?action=coupons&t=${Date.now()}`,{cache:'no-store'});const j=await r.json();if(!j.success)throw new Error(j.message||j.error||'خطأ');coupons=j.coupons||[];render()}catch(e){$('list').innerHTML='<div class="empty">تعذر تحميل الكوبونات.</div>'}
}
function render(){if(!coupons.length){$('list').innerHTML='<div class="empty">لا توجد كوبونات بعد.</div>';return}$('list').innerHTML=coupons.map((c,i)=>{const st=couponStatus(c);const labels={active:'فعال',expired:'منتهي',scheduled:'لم يبدأ',disabled:'متوقف'};const discount=c.type==='fixed'?`${Number(c.value).toLocaleString('en-US')} د.ع`:`${c.value}%`;const start=c.start_at||c.start||'';const end=c.end_at||c.end||'';return `<div class="coupon"><div><h3>${c.code} <span class="badge ${st}">${labels[st]||st}</span></h3><div class="meta">الخصم: ${discount} • الحد الأدنى: ${Number(c.min||0).toLocaleString('en-US')} د.ع<br>البداية: ${fmt(start,'يبدأ فوراً')}<br>الانتهاء: ${fmt(end,'بدون انتهاء')}</div></div><div class="actions"><button class="secondary" data-edit="${i}" type="button">تعديل</button><button class="danger" data-delete="${c.code}" type="button">حذف</button></div></div>`}).join('')}
function reset(){editing='';$('couponForm').reset();$('active').checked=true;$('min').value='0';$('code').disabled=false;$('saveBtn').textContent='+ إنشاء الكوبون';$('cancelBtn').style.display='none';$('status').className='status'}
$('couponForm').addEventListener('submit',async e=>{e.preventDefault();const code=$('code').value.trim().toUpperCase().replace(/\s+/g,'');if(!code)return;const startValue=$('start').value;const endValue=$('end').value;const body=new URLSearchParams({action:editing?'coupon_update':'coupon_add',code,type:$('type').value,value:$('value').value,min:$('min').value||'0',start_at:startValue,end_at:endValue,start:startValue,end:endValue,active:$('active').checked?'1':'0'});$('saveBtn').disabled=true;try{const r=await fetch(SCRIPT_URL,{method:'POST',body});const j=await r.json();if(!j.success)throw new Error(j.message||j.error||'تعذر الحفظ');status(editing?'تم تحديث الكوبون':'تم إنشاء الكوبون');reset();await load()}catch(err){status(String(err.message||err),false)}finally{$('saveBtn').disabled=false}});
$('list').addEventListener('click',async e=>{const eb=e.target.closest('[data-edit]');if(eb){const c=coupons[Number(eb.dataset.edit)];editing=c.code;$('code').value=c.code;$('code').disabled=true;$('type').value=c.type;$('value').value=c.value;$('min').value=c.min||0;$('start').value=localValue(c.start_at||c.start);$('end').value=localValue(c.end_at||c.end);$('active').checked=isCouponActive(c);$('saveBtn').textContent='حفظ التعديل';$('cancelBtn').style.display='block';scrollTo({top:0,behavior:'smooth'});return}const db=e.target.closest('[data-delete]');if(db){if(!confirm(`حذف الكوبون ${db.dataset.delete} نهائياً؟`))return;try{const r=await fetch(SCRIPT_URL,{method:'POST',body:new URLSearchParams({action:'coupon_delete',code:db.dataset.delete})});const j=await r.json();if(!j.success)throw new Error(j.message||j.error||'تعذر الحذف');await load()}catch(err){alert(err.message||err)}}});
$('cancelBtn').onclick=reset;$('refresh').onclick=load;load();
</script>
</body>
</html>
